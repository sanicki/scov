name: Publish site

on:
  push:
    branches: [main]
    paths:
      - PDF/**
      - text/**
      - links.md
      - scripts/build_site.py
      - scripts/a11y-check.mjs
      - .github/workflows/pages.yml
  # Also started by download-pdfs.yml, since its pushes don't trigger `on: push`.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The site only links to the PDFs, so skip downloading them (~2.5 GB):
      # fetch file contents on demand and leave the PDFs out of the checkout.
      - uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/PDF/*.pdf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build site
        run: python scripts/build_site.py links.md PDF _site text

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Uses the Chrome preinstalled on GitHub's Ubuntu runners: installing a
      # browser with --with-deps runs apt-get, which once hung for 40+ minutes.
      - name: Accessibility audit (axe-core, WCAG 2.2 AA)
        timeout-minutes: 10
        run: |
          npm install --no-save --no-audit --no-fund axe-core@4 playwright@1
          if CHROMIUM_PATH=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium); then
            export CHROMIUM_PATH
          else
            npx playwright install chromium
          fi
          node scripts/a11y-check.mjs _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
