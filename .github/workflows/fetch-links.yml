name: Fetch flipbook links

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: archive-main
  cancel-in-progress: false

env:
  ISSUU_USER: scvcommunications

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Update links.md
        run: python scripts/fetch_links.py "$ISSUU_USER" links.md

      - name: Commit and push
        id: commit
        run: |
          git add links.md
          if git diff --cached --quiet; then
            echo "links.md unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update flipbook links"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger `on: push` workflows,
      # so start the PDF download explicitly.
      - name: Trigger PDF download
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run download-pdfs.yml --ref main
