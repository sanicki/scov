name: Download flipbook PDFs

on:
  push:
    branches: [main]
    paths: [links.md]
  workflow_dispatch:
    inputs:
      max_per_run:
        description: Maximum number of PDFs to download in this run
        default: "10"

permissions:
  contents: write
  actions: write

concurrency:
  group: archive-main
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download missing PDFs
        id: download
        run: python scripts/download_pdfs.py links.md PDF "${{ inputs.max_per_run || '10' }}"

      - name: Commit and push
        if: always()
        run: |
          git add PDF
          if git diff --cached --quiet; then
            echo "No new PDFs."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add flipbook PDFs"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 10))
          done
          exit 1

      # Work through a large backlog in batches; stops once a run makes no progress.
      - name: Continue with next batch
        if: steps.download.outputs.remaining > 0 && steps.download.outputs.downloaded > 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run download-pdfs.yml --ref main -f max_per_run="${{ inputs.max_per_run || '10' }}"
